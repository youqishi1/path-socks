name: test

on:
  push:
    branches: [main, dual-schemes]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - name: Go tests
        run: go test -race ./...
      - name: Shell syntax
        run: |
          for file in install.sh install-nginx.sh install-path.sh install-reality.sh sbb path-manager renew.sh; do bash -n "$file"; done
          sh -n path-socks-tls.openrc
          sh -n bootstrap.sh
      - name: Port collision tests
        run: python3 -m unittest -v test_ports.py test_manual_export.py
      - name: Offline client helper and real upstream cores
        run: |
          node test_clients.cjs
          python3 -m unittest -v test_reality.py test_mihomo.py
      - name: Rebuild and verify published binaries
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -buildvcs=false -trimpath -ldflags='-s -w' -o bin/path-socks-linux-amd64 ./cmd/path-socks
          GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags='-s -w' -o bin/path-socks-linux-arm64 ./cmd/path-socks
          cd bin
          test "$(wc -l < ../checksums.txt)" -eq 2
          sha256sum --strict -c ../checksums.txt
      - name: Standalone installer coexistence (local ACME fixture)
        run: sudo --preserve-env=GITHUB_ACTIONS python3 test_install.py
      - name: REALITY install and upgrade coexistence
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -m unittest -v test_reality_install.py
      - name: Original 80/443 Nginx install and rollback (local ACME fixture)
        run: sudo --preserve-env=GITHUB_ACTIONS python3 test_nginx_mode.py
