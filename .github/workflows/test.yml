name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: true
      - name: Go tests
        run: go test -race ./...
      - name: Shell syntax
        run: |
          bash -n install.sh sbb
          sh -n bootstrap.sh
      - name: Rebuild and verify published binaries
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o bin/path-socks-linux-amd64 ./cmd/path-socks
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o bin/path-socks-linux-arm64 ./cmd/path-socks
          cd bin
          sha256sum -c ../checksums.txt
